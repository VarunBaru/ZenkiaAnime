name: Build installable apps

on:
  pull_request:
    paths:
      - ".github/workflows/build-installers.yml"
      - "android/**"
      - "desktop/**"
      - "src/components/AuthForm.tsx"
      - "src/routes/__root.tsx"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-installers.yml"
      - "android/**"
      - "desktop/**"
      - "public/brand-app-icon-512.svg"
      - "public/favicon.ico"
      - "src/components/AuthForm.tsx"
      - "src/routes/__root.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare branded Android launcher icon
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          svg = Path("public/brand-app-icon-512.svg").read_text()
          match = re.search(r'data:image/webp;base64,([^"]+)', svg)
          if not match:
              raise SystemExit("Could not find the existing branded WebP icon in the app icon SVG.")
          icon = Path("android/app/src/main/res/drawable-nodpi/brand_app_icon.webp")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_bytes(base64.b64decode(match.group(1)))
          PY
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }} :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZenkiaAnime-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Electron packaging tools
        run: npm install --prefix desktop
      - name: Build installer
        run: npm run build:win --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ZenkiaAnime-Windows-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish permanent package downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-apk, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ZenkiaAnime-Android-APK
          path: release/android
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ZenkiaAnime-Windows-Setup
          path: release/windows
      - name: Prepare stable asset names
        run: |
          cp release/android/app-debug.apk release/ZenkiaAnime-Android.apk
          exe="$(find release/windows -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$exe"
          cp "$exe" release/ZenkiaAnime-Windows-Setup.exe
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<'EOF'
          Install these packages from the Zenkia Anime installation page.

          The Android APK is a debug-signed test build. Because the signing key is not persisted on the build runner, installing a future APK update may require uninstalling the previous APK first. The Windows installer is unsigned, so Windows SmartScreen may show a warning.
          EOF
          gh release create "$tag" \
            release/ZenkiaAnime-Android.apk \
            release/ZenkiaAnime-Windows-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zenkia Anime $tag" \
            --notes-file release-notes.md \
            --latest
