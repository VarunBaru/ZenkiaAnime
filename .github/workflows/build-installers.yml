name: Build installable apps

on:
  pull_request:
    paths:
      - ".github/workflows/build-installers.yml"
      - "android/**"
      - "desktop/**"
      - "src/components/AuthForm.tsx"
      - "src/routes/__root.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare branded Android launcher icon
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          svg = Path("public/brand-app-icon-512.svg").read_text()
          match = re.search(r'data:image/webp;base64,([^"]+)', svg)
          if not match:
              raise SystemExit("Could not find the existing branded WebP icon in the app icon SVG.")
          icon = Path("android/app/src/main/res/drawable-nodpi/brand_app_icon.webp")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_bytes(base64.b64decode(match.group(1)))
          PY
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZenkiaAnime-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Electron packaging tools
        run: npm install --prefix desktop
      - name: Build installer
        run: npm run build:win --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ZenkiaAnime-Windows-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
