plugins {
    id "com.android.application"
}

android {
    namespace "com.zenkia.anime"
    compileSdk 36

    defaultConfig {
        applicationId "com.zenkia.anime"
        minSdk 24
        targetSdk 35
        versionCode project.findProperty("VERSION_CODE")?.toString()?.toInteger() ?: 1
        versionName project.findProperty("VERSION_NAME")?.toString() ?: "1.0.0"
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
